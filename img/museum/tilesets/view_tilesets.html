<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tileset GID Viewer</title>
    <style>
        body { font-family: monospace; background: #1a1a1a; color: #fff; padding: 20px; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 40px; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .tileset-wrapper { background: #2a2a2a; border: 2px solid #555; padding: 10px; margin-bottom: 20px; }
        .tileset-title { font-weight: bold; margin-bottom: 10px; color: #ffd700; }
        .tiles-grid { display: grid; background: #111; border: 1px solid #333; }
        .tile-box { width: 48px; height: 48px; position: relative; border: 1px solid #222; box-sizing: border-box; }
        .tile-img { width: 48px; height: 48px; image-rendering: pixelated; }
        .tile-id { 
            position: absolute; bottom: 0; right: 0; 
            background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; 
            padding: 1px 3px; pointer-events: none; border-top-left-radius: 3px; 
        }
    </style>
</head>
<body>
    <h1>Tileset GID (Global ID) Viewer</h1>
    <p>Use these IDs to map floors, walls, and furniture in Tiled JSON layers.</p>

    <div id="viewers-container"></div>

    <script>
        const tilesets = [
            { name: "Wooden House (Floor/Walls Base)", src: "Wooden House.png", width: 112, height: 80, firstgid: 1 },
            { name: "Wooden House Walls", src: "Wooden_House_Walls_Tilset.png", width: 80, height: 48, firstgid: 36 },
            { name: "Basic Furniture", src: "../Objects/Basic Furniture.png", width: 144, height: 96, firstgid: 51 },
            { name: "Decorations BR", src: "../Objects/decorations_BR.png", width: 192, height: 192, firstgid: 105 }
        ];

        const container = document.getElementById("viewers-container");

        tilesets.forEach(ts => {
            const wrapper = document.createElement("div");
            wrapper.className = "tileset-wrapper";
            
            const title = document.createElement("div");
            title.className = "tileset-title";
            title.textContent = `${ts.name} (firstgid: ${ts.firstgid})`;
            wrapper.appendChild(title);
            
            const cols = ts.width / 16;
            const rows = ts.height / 16;
            const grid = document.createElement("div");
            grid.className = "tiles-grid";
            grid.style.gridTemplateColumns = `repeat(${cols}, 48px)`;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const tileIndex = r * cols + c;
                    const gid = ts.firstgid + tileIndex;
                    
                    const box = document.createElement("div");
                    box.className = "tile-box";
                    
                    const canvas = document.createElement("canvas");
                    canvas.width = 16;
                    canvas.height = 16;
                    canvas.className = "tile-img";
                    const ctx = canvas.getContext("2d");
                    
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, c * 16, r * 16, 16, 16, 0, 0, 16, 16);
                    };
                    img.src = ts.src;
                    
                    box.appendChild(canvas);
                    
                    const label = document.createElement("div");
                    label.className = "tile-id";
                    label.textContent = gid;
                    box.appendChild(label);
                    
                    grid.appendChild(box);
                }
            }
            
            wrapper.appendChild(grid);
            container.appendChild(wrapper);
        });
    </script>
</body>
</html>
